name: Frequent Update

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  update-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.x

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: cd source && pip install --no-cache-dir -r requirements.txt

      - name: Run script
        env:
          MY_TOKEN: ${{ secrets.WLCNONKEY }}
          CONFIGSWORKING: ${{ secrets.CONFIGSWORKING }}
          WLCONFIGSWORKING: ${{ secrets.WLCONFIGSWORKING }}
          WLCNONREP_TOKEN: ${{ secrets.WLCNONREP_TOKEN }}
          WLCNONREP_REPO: ${{ secrets.WLCNONREP_REPO }}
          WLCNONREP_PATH: ${{ secrets.WLCNONREP_PATH }}
          WLCNONREP_HEADERS: ${{ secrets.WLCNONREP_HEADERS }}
        run: |
          cd source && python main.py
